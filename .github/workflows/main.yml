<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Migração - LEVE IA</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #0f172a; color: #ffffff; text-align: center; padding: 50px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; }
        .btn { background-color: #38bdf8; color: #0f172a; padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .btn:hover { background-color: #0ea5e9; }
        #status { margin-top: 20px; font-size: 18px; }
        .info-box { background: #334155; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; }
        .logo { max-width: 100px; margin-bottom: 20px; }
    </style>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js" type="application/javascript"></script>
</head>
<body>
    <div class="container">
        <img src="https://placehold.co/100x100?text=LEVE" alt="Leve IA Logo" class="logo"> 
        <h1>Portal de Migração V2</h1>
        <p>Conecte sua carteira para verificar seu saldo de migração.</p>
        
        <button class="btn" onclick="connectWallet()">Conectar Carteira</button>
        
        <div id="infoArea" class="info-box">
            <p>Carteira Conectada:</p>
            <p id="walletAddress" style="color: #38bdf8; word-break: break-all;">-</p>
            <hr style="border-color: #475569;">
            <h3>Seu Saldo Reservado:</h3>
            <h2 id="claimableAmount" style="color: #4ade80;">0 LEVE</h2>
            <p style="font-size: 12px; color: #94a3b8;">*O saque será liberado conforme o cronograma oficial.</p>
        </div>
        
        <p id="status"></p>
    </div>

    <script>
        const VAULT_ADDRESS = "0x4474Ad931757466B401ABE0B93445E8cB21ddCc6"; // Seu Cofre Real
        const VAULT_ABI = [
            "function beneficiaries(address) view returns (uint256 totalAmount, uint256 claimedAmount)",
            "function calculateReleasable(address) view returns (uint256)"
        ];

        async function connectWallet() {
            const status = document.getElementById("status");
            const infoArea = document.getElementById("infoArea");
            
            if (!window.ethereum) {
                status.innerText = "ERRO: Instale a MetaMask ou use o navegador da TrustWallet.";
                return;
            }

            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                const address = await signer.getAddress();

                document.getElementById("walletAddress").innerText = address;
                infoArea.style.display = "block";
                status.innerText = "Buscando dados na Blockchain...";

                const contract = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, provider);
                
                // Consulta o total que a pessoa tem direito (Struct Beneficiaries)
                const userData = await contract.beneficiaries(address);
                const totalAmount = ethers.utils.formatUnits(userData.totalAmount, 18);

                if (parseFloat(totalAmount) > 0) {
                    document.getElementById("claimableAmount").innerText = parseFloat(totalAmount).toLocaleString('pt-BR') + " LEVE";
                    status.innerText = "✅ Você possui tokens para migração!";
                } else {
                    document.getElementById("claimableAmount").innerText = "0 LEVE";
                    status.innerText = "⚠️ Nenhum saldo encontrado para esta carteira na lista de migração.";
                }

            } catch (error) {
                console.error(error);
                status.innerText = "Erro ao conectar: " + error.message;
            }
        }
    </script>
</body>
</html>
